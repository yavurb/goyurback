name: Test GoYurback

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - go.mod
      - go.sum
  pull_request:
    branches-ignore:
      - production
    paths:
      - "**.go"
      - go.mod
      - go.sum

jobs:
  test:
    name: Test and upload code coverage
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install modules
        run: go mod download

      - name: Setup Environment
        run: |
          just write_version

      - name: Run tests
        run: |
          just test
